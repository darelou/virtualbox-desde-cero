<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="VirtualBox desde cero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="0.55" stop-color="#123a6b"/>
      <stop offset="1" stop-color="#1b6fb5"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dce9f7" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <g opacity="0.08" fill="#ffffff">
    <circle cx="1080" cy="40" r="140"/>
    <circle cx="140" cy="330" r="120"/>
  </g>

  <!-- Equipo anfitrión con tres máquinas virtuales -->
  <g transform="translate(770 62)">
    <rect x="0" y="0" width="360" height="216" rx="16" fill="#0a1830" opacity="0.55"/>
    <rect x="0" y="0" width="360" height="30" rx="16" fill="#0a1830" opacity="0.8"/>
    <circle cx="22" cy="15" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="15" r="5" fill="#febc2e"/>
    <circle cx="58" cy="15" r="5" fill="#28c840"/>
    <text x="180" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9ec5ee">tu ordenador (anfitrión)</text>

    <g transform="translate(18 46)">
      <rect width="100" height="74" rx="8" fill="#eef4fb"/>
      <rect width="100" height="16" rx="8" fill="#1b6fb5"/>
      <rect x="10" y="26" width="60" height="6" rx="3" fill="#123a6b" opacity="0.7"/>
      <rect x="10" y="38" width="80" height="6" rx="3" fill="#123a6b" opacity="0.4"/>
      <rect x="10" y="50" width="45" height="6" rx="3" fill="#123a6b" opacity="0.4"/>
      <text x="50" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dce9f7">Linux</text>
    </g>
    <g transform="translate(130 46)">
      <rect width="100" height="74" rx="8" fill="#eef4fb"/>
      <rect width="100" height="16" rx="8" fill="url(#accent)"/>
      <rect x="10" y="26" width="35" height="35" rx="4" fill="#1b6fb5" opacity="0.8"/>
      <rect x="52" y="26" width="38" height="6" rx="3" fill="#123a6b" opacity="0.5"/>
      <rect x="52" y="38" width="30" height="6" rx="3" fill="#123a6b" opacity="0.4"/>
      <text x="50" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dce9f7">Windows</text>
    </g>
    <g transform="translate(242 46)">
      <rect width="100" height="74" rx="8" fill="#eef4fb"/>
      <rect width="100" height="16" rx="8" fill="#28a06a"/>
      <text x="12" y="38" font-family="Consolas, monospace" font-size="11" fill="#123a6b">$ ping</text>
      <text x="12" y="54" font-family="Consolas, monospace" font-size="11" fill="#123a6b">$ ls _</text>
      <text x="50" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#dce9f7">Laboratorio</text>
    </g>
    <rect x="18" y="160" width="324" height="36" rx="10" fill="#ffffff" opacity="0.1"/>
    <text x="180" y="183" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff" opacity="0.9">VirtualBox reparte CPU, memoria y disco</text>
  </g>

  <text x="70" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">VirtualBox</text>
  <text x="70" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#accent)">desde cero</text>
  <text x="72" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#cfe2f6">Guía completa en español para aprender a usar</text>
  <text x="72" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#cfe2f6">máquinas virtuales, paso a paso y con capturas reales.</text>
</svg>
